<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOODING LAB</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:#13201B;color:#DCE6E0;
    font-family:-apple-system,BlinkMacSystemFont,'Pretendard Variable',Pretendard,system-ui,sans-serif;
    letter-spacing:-.01em}
  .box{max-width:520px;text-align:center}
  .wm{font-family:'Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:.22em;color:#fff}
  .wm i{font-style:normal;color:#219466}
  .rule{width:28px;height:2px;background:#E8B23A;margin:16px auto 22px;border-radius:2px}
  h1{font-size:27px;font-weight:800;line-height:1.35;letter-spacing:-.035em;color:#fff}
  p{margin-top:14px;font-size:14px;line-height:1.85;color:rgba(220,230,224,.72)}
  .figs{display:flex;gap:30px;justify-content:center;margin-top:28px;flex-wrap:wrap}
  .fig b{display:block;font-family:'Helvetica Neue',Arial,sans-serif;font-size:23px;font-weight:800;color:#E8B23A}
  .fig span{font-size:12px;color:rgba(220,230,224,.6)}
  a.btn{display:inline-block;margin-top:30px;padding:12px 22px;border-radius:999px;
    background:#1A7452;color:#fff;font-size:14px;font-weight:700;text-decoration:none}
  a.btn:hover{background:#219466}
  .foot{margin-top:34px;font-size:11.5px;color:rgba(220,230,224,.42);line-height:1.9}
</style>
</head>
<body>
  <div class="box">
    <div class="wm">FOODING LAB<i>.</i></div>
    <div class="rule"></div>
    <h1>건강식품 브랜드,<br>100개부터 시작하세요</h1>
    <p>기획 · 배합 설계 · 서류 · 디자인 · 생산 · 물류까지 한 곳에서.<br>대외 사이트는 준비 중입니다.</p>
    <div class="figs">
      <div class="fig"><b>100</b><span>최소 발주 수량</span></div>
      <div class="fig"><b>4주</b><span>테스트 재고까지</span></div>
      <div class="fig"><b>12개월</b><span>무이자 할부</span></div>
    </div>
    <a class="btn" href="/apply.html">제조 상담 신청</a>
    <div style="margin-top:14px"><a href="https://foodinglab.com" rel="noopener" style="font-size:12.5px;color:rgba(220,230,224,.6);text-decoration:underline">푸딩랩 본사이트 바로가기</a></div>
    <div class="foot">
      주식회사 서래바이오 · 대표 지종환 · 사업자등록번호 848-88-02640<br>
      경기도 화성시 정남면 신백길 102-14 · 031-354-6110
    </div>
  </div>

</html>
